version: '3.8'

networks:
  iris_custom_net:
    driver: bridge

services:
  db:
    image: postgis/postgis:16-3.4
    networks:
      - iris_custom_net
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    profiles: ["app"]
    networks:
      - iris_custom_net
    environment:
      - REGION=${REGION}
      - COUNTRY=${COUNTRY}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - OUTPUT_PATH=${OUTPUT_PATH}
      - SOURCE_ENDPOINT=${SOURCE_ENDPOINT}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python src/infrastructure/migrations.py && python src/worker.py"]
    volumes:
      - ./data:/app/data

  smoke_test:
    build: .
    profiles: ["test"]
    networks:
      - iris_custom_net
    environment:
      - REGION=${REGION}
      - COUNTRY=${COUNTRY}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - OUTPUT_PATH=${OUTPUT_PATH}
      - SOURCE_ENDPOINT=${SOURCE_ENDPOINT}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python src/infrastructure/migrations.py && pytest tests/ -v"]
    volumes:
      - ./data:/app/data
      - ./tests:/app/tests
